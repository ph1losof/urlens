name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke-test built artifact under Node
        run: |
          node --version
          node -e "import('./dist/index.js').then(m => {
            const ok = m.readQueryParam('https://x.test/?q=hello+world', 'q') === 'hello world'
              && m.readPathname('https://x.test/api/v1') === '/api/v1'
              && m.readOrigin('https://x.test:8080/') === 'https://x.test:8080';
            if (!ok) { console.error('smoke test failed'); process.exit(1); }
            console.log('built artifact OK');
          })"

  bench:
    name: bench (cross-engine)
    runs-on: ubuntu-latest
    # Run after tests pass so we don't burn ~5 min downloading browsers for a broken build.
    needs: test
    # Write access is needed only for the README auto-update step (push to main).
    # On pull_request the job is still read-only — the commit step is conditional.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full ref so we can push back to main.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run cross-engine benchmark
        id: bench
        run: |
          set -o pipefail
          bun run bench 2>&1 | tee bench-output.txt

      - name: Publish bench output to job summary
        if: always()
        run: |
          {
            echo "## Cross-engine benchmark"
            echo ""
            echo "Shared GitHub-hosted runners are noisy; treat absolute numbers as soft. The"
            echo "speedup ratios (ours vs native) are what should stay stable across runs."
            echo ""
            echo '```'
            cat bench-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: bench-output.txt
          retention-days: 30

      - name: Update README with bench results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun scripts/update-readme-bench.ts bench-output.txt

      - name: Commit README if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- README.md; then
            echo "README bench block unchanged — no commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # [skip ci] avoids triggering this same workflow recursively.
          git commit -m "ci(bench): update README benchmark table [skip ci]"
          git push
