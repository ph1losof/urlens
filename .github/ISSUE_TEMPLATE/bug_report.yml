name: Bug report
description: Report reproducible incorrect behavior in urlens
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not report security vulnerabilities here; use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: urlens version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Include the runtime name and exact version.
      placeholder: Node.js 22.14.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide runnable code and the smallest input that demonstrates the problem.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant logs, operating system details, or related links.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain undisclosed security vulnerability details.
          required: true
